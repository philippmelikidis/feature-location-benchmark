name: CI

# Leichter PR-Check: Linter (nur Fehler-Level, kein Style-Noise im Legacy-Code)
# + Unit-/Regressionstests. Die Tests stubben schwere Dependencies
# (torch/sentence-transformers/elasticsearch) — kein GPU/ES nötig.
# Benchmark-Läufe selbst laufen weiterhin über benchmark_*.yml.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: "Ruff (Fehler-Level: Syntax/Undefined/F-String)"
        run: ruff check --select E9,F63,F7,F82 benchmark scripts tests

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies (leichtgewichtig, kein torch)
        run: pip install "tree-sitter>=0.24.0" "tree-sitter-python>=0.23.0" tiktoken "pydantic>=2.0"
      - name: Run test suites
        run: |
          set -e
          for t in tests/test_*.py; do
            echo "=== $t ==="
            python "$t"
          done
